name: Olaf iOS build

# Unsigned IPA; Impactor signs and installs it from the PC (it keeps HealthKit). No Mac needed.
on:
  push:
    paths: ['apps/ios/**', '.github/workflows/olaf-ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Olaf.xcodeproj \
            -scheme Olaf \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Olaf.app Payload/
          # Unsigned builds carry no entitlements; embed them ad hoc so the sideloader can keep HealthKit.
          codesign --force --sign - --entitlements Olaf/Olaf.entitlements Payload/Olaf.app
          zip -qry Olaf.ipa Payload

      - name: Publish as "olaf-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete olaf-latest -y --cleanup-tag || true
          gh release create olaf-latest Olaf.ipa --target ${{ github.sha }} \
            --title "Olaf build ${{ github.run_number }}" \
            --notes "Download Olaf.ipa and install it with Impactor from the PC."
