name: Olaf iOS build

# Unsigned IPA; SideStore signs and installs it on the phone. No Mac needed.
on:
  push:
    paths: ['apps/ios/**', '.github/workflows/olaf-ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Olaf.xcodeproj \
            -scheme Olaf \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Olaf.app Payload/
          zip -qry Olaf.ipa Payload

      - name: Publish as "olaf-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete olaf-latest -y --cleanup-tag || true
          gh release create olaf-latest Olaf.ipa --target ${{ github.sha }} \
            --title "Olaf build ${{ github.run_number }}" \
            --notes "Open this page in Safari on your iPhone, download Olaf.ipa and install it with SideStore."
