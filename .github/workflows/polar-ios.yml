name: Polar iOS build

on:
  push:
    branches: [main]
    paths:
      - 'apps/polar/**'
      - 'packages/**'
      - '.github/workflows/polar-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polar-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Expo SDK 57 needs Xcode 26+ (ExpoModulesJSI xcframework prebuild).
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "::notice::Using $(xcodebuild -version | head -1) ($XCODE)"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Expo prebuild (generate ios/ project, incl. the Live Activity target)
        working-directory: apps/polar
        run: npx expo prebuild -p ios --no-install --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            apps/polar/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/polar/ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Pod install
        working-directory: apps/polar/ios
        run: pod install --repo-update

      - name: Build (unsigned; SideStore signs it on your phone)
        working-directory: apps/polar/ios
        run: |
          set +e -uo pipefail  # the runner starts bash with -e; keep going so errors can be reported
          xcodebuild \
            -workspace Polar.xcworkspace \
            -scheme Polar \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler errors as annotations (readable without downloading the log).
            # GitHub keeps max 10 annotations per level per step, so only real compiler/script errors.
            { grep -E ": error: |^error: |fatal error:|Error: |nonzero exit code" xcodebuild.log | sort -u | head -10; } | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            # The "following build commands failed" summary names the failing target/phase.
            sed -n '/The following build commands failed/,$p' xcodebuild.log | head -10 | while IFS= read -r line; do
              echo "::warning::${line:0:900}"
            done
            exit "$status"
          fi

      - name: Package IPA
        working-directory: apps/polar/ios
        run: |
          set -euo pipefail
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Polar.app Payload/
          zip -qry Polar.ipa Payload

      - name: Publish "polar-latest" release
        working-directory: apps/polar/ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete polar-latest -y --cleanup-tag || true
          gh release create polar-latest Polar.ipa \
            --repo "${{ github.repository }}" \
            --title "Polar build ${{ github.run_number }}" \
            --notes "Download Polar.ipa on your iPhone (in Safari) and install it with SideStore. See README > Polar on your iPhone."
